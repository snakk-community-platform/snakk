# Development compose — builds from source.
# Production installs use pre-built images from ghcr.io (see snakk-installer).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    environment:
      POSTGRES_DB: snakk
      POSTGRES_USER: snakk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snakk -d snakk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Internal only — not exposed to host
    expose:
      - "5432"

  snakk:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SNAKK_PORT:-17000}:17000"
    volumes:
      - snakk-storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    environment:
      # Set ASPNETCORE_ENVIRONMENT=Development in .env for local source builds.
      # Defaults to Production so shared/staging deployments don't expose debug endpoints.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DB_HOST: postgres
      DB_PORT: "5432"
      # Connection string for DbSeeder on restart (pending migrations)
      ConnectionStrings__DbConnection: "Host=postgres;Port=5432;Database=snakk;Username=snakk;Password=${POSTGRES_PASSWORD}"
      Gateway__DisableHealthChecks: "true"
      Valkey__ConnectionString: valkey:6379

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --loglevel warning
    expose:
      - "6379"

  # --- Monitoring (opt-in: docker compose --profile monitoring up -d) ---

  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=500MB
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

volumes:
  pgdata:
    driver: local
  snakk-storage:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
