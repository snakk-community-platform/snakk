[unix_http_server]
file=/app/run/supervisor.sock

[supervisorctl]
serverurl=unix:///app/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/app/run/supervisord.pid

# ---------------------------------------------------------------------------
# Snakk Services — ordered by dependency (lower priority = starts first)
# ---------------------------------------------------------------------------

[program:realtime]
command=dotnet /app/realtime/Snakk.Realtime.dll
directory=/app/realtime
autostart=false
autorestart=true
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    DOTNET_GCHeapHardLimitPercent="10",
    ASPNETCORE_ENVIRONMENT="%(ENV_ASPNETCORE_ENVIRONMENT)s",
    ASPNETCORE_URLS="http://127.0.0.1:17003",
    FileStorage__BasePath="/app/storage",
    SnakkApi__BaseUrl="http://127.0.0.1:17002",
    PYROSCOPE_APPLICATION_NAME="Snakk.Realtime",
    PYROSCOPE_PROFILING_ENABLED="1",
    CORECLR_ENABLE_PROFILING="1",
    CORECLR_PROFILER="{BD1A650D-AC5D-4896-B64F-D6FA25D6B26A}",
    CORECLR_PROFILER_PATH="/opt/pyroscope/Pyroscope.Profiler.Native.so",
    LD_PRELOAD="/opt/pyroscope/Pyroscope.Linux.ApiWrapper.x64.so"

[program:api]
command=dotnet /app/api/Snakk.Api.dll
directory=/app/api
autostart=false
autorestart=true
priority=200
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    DOTNET_GCHeapHardLimitPercent="25",
    ASPNETCORE_ENVIRONMENT="%(ENV_ASPNETCORE_ENVIRONMENT)s",
    ASPNETCORE_URLS="http://127.0.0.1:17001",
    ASPNETCORE_FORWARDEDHEADERS_ENABLED="true",
    RestPort="17002",
    FileStorage__BasePath="/app/storage",
    Realtime__BaseUrl="http://127.0.0.1:17003",
    WebClientUrl="http://127.0.0.1:17010",
    PYROSCOPE_APPLICATION_NAME="Snakk.Api",
    PYROSCOPE_PROFILING_ENABLED="1",
    CORECLR_ENABLE_PROFILING="1",
    CORECLR_PROFILER="{BD1A650D-AC5D-4896-B64F-D6FA25D6B26A}",
    CORECLR_PROFILER_PATH="/opt/pyroscope/Pyroscope.Profiler.Native.so",
    LD_PRELOAD="/opt/pyroscope/Pyroscope.Linux.ApiWrapper.x64.so"

