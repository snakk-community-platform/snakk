[unix_http_server]
file=/app/run/supervisor.sock

[supervisorctl]
serverurl=unix:///app/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/app/run/supervisord.pid

# ---------------------------------------------------------------------------
# Snakk Services — ordered by dependency (lower priority = starts first)
# ---------------------------------------------------------------------------

[program:realtime]
command=dotnet /app/realtime/Snakk.Realtime.dll
directory=/app/realtime
autostart=true
autorestart=true
priority=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    ASPNETCORE_ENVIRONMENT="Production",
    ASPNETCORE_URLS="http://127.0.0.1:5300",
    ASPNETCORE_FORWARDEDHEADERS_ENABLED="true",
    FileStorage__BasePath="/app/storage"

[program:api]
command=dotnet /app/api/Snakk.Api.dll
directory=/app/api
autostart=true
autorestart=true
priority=200
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    ASPNETCORE_ENVIRONMENT="Production",
    ASPNETCORE_URLS="http://127.0.0.1:5242",
    ASPNETCORE_FORWARDEDHEADERS_ENABLED="true",
    FileStorage__BasePath="/app/storage",
    Realtime__BaseUrl="http://127.0.0.1:5300",
    WebClientUrl="http://127.0.0.1:5001"

[program:setup]
command=dotnet /app/setup/Snakk.Setup.dll
directory=/app/setup
autostart=true
autorestart=false
priority=250
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    ASPNETCORE_ENVIRONMENT="Production",
    ASPNETCORE_URLS="http://127.0.0.1:5003",
    ASPNETCORE_FORWARDEDHEADERS_ENABLED="true",
    FileStorage__BasePath="/app/storage"

[program:web]
command=dotnet /app/web/Snakk.Web.dll
directory=/app/web
autostart=true
autorestart=true
priority=300
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    ASPNETCORE_ENVIRONMENT="Production",
    ASPNETCORE_URLS="http://127.0.0.1:5001",
    ASPNETCORE_FORWARDEDHEADERS_ENABLED="true",
    FileStorage__BasePath="/app/storage",
    ApiBaseUrl="http://127.0.0.1:5242"

[program:auth]
command=dotnet /app/auth/Snakk.Auth.dll
directory=/app/auth
autostart=true
autorestart=true
priority=300
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    ASPNETCORE_ENVIRONMENT="Production",
    ASPNETCORE_URLS="http://127.0.0.1:5111",
    ASPNETCORE_FORWARDEDHEADERS_ENABLED="true",
    FileStorage__BasePath="/app/storage",
    ApiBaseUrl="http://127.0.0.1:5242"

[program:admin]
command=dotnet /app/admin/Snakk.Admin.dll
directory=/app/admin
autostart=true
autorestart=true
priority=300
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    ASPNETCORE_ENVIRONMENT="Production",
    ASPNETCORE_URLS="http://127.0.0.1:5002",
    ASPNETCORE_FORWARDEDHEADERS_ENABLED="true",
    FileStorage__BasePath="/app/storage",
    SnakkApi__BaseUrl="http://127.0.0.1:5242"

[program:worker]
command=dotnet /app/worker/Snakk.Worker.dll
directory=/app/worker
autostart=true
autorestart=true
priority=350
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    DOTNET_ENVIRONMENT="Production",
    FileStorage__BasePath="/app/storage"

[program:gateway]
command=dotnet /app/gateway/Snakk.Gateway.dll
directory=/app/gateway
autostart=true
autorestart=true
priority=400
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=
    ASPNETCORE_ENVIRONMENT="Production",
    ASPNETCORE_URLS="http://0.0.0.0:17000",
    ASPNETCORE_FORWARDEDHEADERS_ENABLED="true",
    SNAKK_STORAGE_PATH="/app/storage",
    ReverseProxy__Clusters__web-cluster__Destinations__web__Address="http://127.0.0.1:5001",
    ReverseProxy__Clusters__auth-cluster__Destinations__auth__Address="http://127.0.0.1:5111",
    ReverseProxy__Clusters__admin-cluster__Destinations__admin__Address="http://127.0.0.1:5002",
    ReverseProxy__Clusters__realtime-cluster__Destinations__realtime__Address="http://127.0.0.1:5300",
    ReverseProxy__Clusters__setup-cluster__Destinations__setup__Address="http://127.0.0.1:5003"
