global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Snakk.Web — routed via gateway since internal services bind to 127.0.0.1
  - job_name: snakk-web
    metrics_path: /internal/metrics/web
    static_configs:
      - targets: ["snakk:17000"]
        labels:
          service: web

  # Snakk.Api — routed via gateway since internal services bind to 127.0.0.1
  - job_name: snakk-api
    metrics_path: /internal/metrics/api
    static_configs:
      - targets: ["snakk:17000"]
        labels:
          service: api

  # Snakk.Auth — routed via gateway since internal services bind to 127.0.0.1
  - job_name: snakk-auth
    metrics_path: /internal/metrics/auth
    static_configs:
      - targets: ["snakk:17000"]
        labels:
          service: auth

  # Snakk.PublicApi — routed via gateway since internal services bind to 127.0.0.1
  - job_name: snakk-public-api
    metrics_path: /internal/metrics/public-api
    static_configs:
      - targets: ["snakk:17000"]
        labels:
          service: public-api

  # PostgreSQL metrics via postgres_exporter
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  # Valkey (Redis-compatible cache) metrics via redis_exporter
  - job_name: valkey
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: valkey

  # Host system metrics via node_exporter
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node

  # OTel Collector self-telemetry — pipeline throughput, dropped spans, queue
  # depth, exporter errors. Critical for meta-monitoring per OBSERVABILITY-DESIGN §7a.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector

  # Caddy admin API exposes /metrics when `servers { metrics }` is enabled in
  # the Caddyfile. Only populates when the `caddy` profile is up.
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]
        labels:
          service: caddy
