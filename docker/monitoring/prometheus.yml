global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Snakk.Web — routed via gateway since internal services bind to 127.0.0.1
  - job_name: snakk-web
    metrics_path: /internal/metrics/web
    static_configs:
      - targets: ["snakk:17000"]
        labels:
          service: web

  # Snakk.Api — routed via gateway since internal services bind to 127.0.0.1
  - job_name: snakk-api
    metrics_path: /internal/metrics/api
    static_configs:
      - targets: ["snakk:17000"]
        labels:
          service: api

  # PostgreSQL metrics via postgres_exporter
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  # Valkey (Redis-compatible cache) metrics via redis_exporter
  - job_name: valkey
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: valkey

  # Host system metrics via node_exporter
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node
