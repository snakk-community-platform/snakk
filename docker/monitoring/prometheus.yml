global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Snakk.Web — routed via gateway since internal services bind to 127.0.0.1
  - job_name: snakk-web
    metrics_path: /internal/metrics/web
    static_configs:
      - targets: ["snakk:17000"]
        labels:
          service: web

  # Snakk.Api — routed via gateway since internal services bind to 127.0.0.1
  - job_name: snakk-api
    metrics_path: /internal/metrics/api
    static_configs:
      - targets: ["snakk:17000"]
        labels:
          service: api

  # PostgreSQL metrics via pg_stat (optional — add postgres-exporter later)
