# Custom queries for postgres-exporter that augment its built-in metrics.
#
# Loaded via --extend.query-path=/etc/postgres-exporter/queries.yaml. Each
# top-level key becomes the metric prefix; the SELECT is run on every scrape
# and each row turns into a labelled set of metrics.
#
# Cardinality: pg_stat_statements is bounded by pg_stat_statements.max
# (PostgreSQL default 5000, evicted least-recent). We LIMIT the scrape to the
# top 50 by total exec time to keep Prometheus series volume bounded.

pg_stat_statements:
  query: |
    SELECT
      pg_get_userbyid(s.userid)            AS usename,
      d.datname                            AS datname,
      s.queryid::text                      AS queryid,
      regexp_replace(left(s.query, 80), '\s+', ' ', 'g') AS query_text,
      s.calls                              AS calls_total,
      s.total_exec_time / 1000.0           AS total_exec_seconds,
      s.mean_exec_time / 1000.0            AS mean_exec_seconds,
      s.rows                               AS rows_total,
      s.shared_blks_hit                    AS shared_blks_hit_total,
      s.shared_blks_read                   AS shared_blks_read_total,
      CASE
        WHEN (s.shared_blks_hit + s.shared_blks_read) > 0
        THEN s.shared_blks_hit::float / (s.shared_blks_hit + s.shared_blks_read)
        ELSE 1.0
      END                                  AS cache_hit_ratio
    FROM pg_stat_statements s
    JOIN pg_database d ON d.oid = s.dbid
    WHERE s.calls > 0
      AND d.datname = current_database()
    ORDER BY s.total_exec_time DESC
    LIMIT 50
  master: true
  metrics:
    - usename:
        usage: "LABEL"
        description: "Role that executed the statement"
    - datname:
        usage: "LABEL"
        description: "Database the statement ran against"
    - queryid:
        usage: "LABEL"
        description: "Postgres internal hash identifying the normalised statement"
    - query_text:
        usage: "LABEL"
        description: "First 80 chars of the normalised statement (whitespace collapsed)"
    - calls_total:
        usage: "COUNTER"
        description: "Number of times the statement has executed since pg_stat_statements_reset()"
    - total_exec_seconds:
        usage: "COUNTER"
        description: "Cumulative seconds spent executing this statement"
    - mean_exec_seconds:
        usage: "GAUGE"
        description: "Current mean execution time in seconds (resets when the statement is evicted)"
    - rows_total:
        usage: "COUNTER"
        description: "Total rows the statement returned or affected"
    - shared_blks_hit_total:
        usage: "COUNTER"
        description: "Shared buffer cache hits attributed to this statement"
    - shared_blks_read_total:
        usage: "COUNTER"
        description: "Disk reads attributed to this statement (shared_buffers misses)"
    - cache_hit_ratio:
        usage: "GAUGE"
        description: "Lifetime share of this statement's block accesses served from shared_buffers (1.0 = all cached, 0.0 = all disk)"

# Active lock waits — queries currently blocked waiting on a lock.
pg_lock_waits:
  query: |
    SELECT
      l.locktype                                                AS locktype,
      l.mode                                                    AS mode,
      pg_get_userbyid(a.usesysid)                               AS usename,
      a.datname                                                 AS datname,
      regexp_replace(left(a.query, 80), '\s+', ' ', 'g')        AS query_text,
      EXTRACT(EPOCH FROM (now() - a.query_start))               AS wait_seconds
    FROM pg_locks l
    JOIN pg_stat_activity a ON a.pid = l.pid
    WHERE l.granted = false
      AND a.datname = current_database()
  master: true
  metrics:
    - locktype:
        usage: "LABEL"
        description: "Postgres lock object type (relation, transactionid, tuple, …)"
    - mode:
        usage: "LABEL"
        description: "Requested lock mode (ShareLock, ExclusiveLock, …)"
    - usename:
        usage: "LABEL"
        description: "Role whose query is blocked"
    - datname:
        usage: "LABEL"
        description: "Database the blocked query is running against"
    - query_text:
        usage: "LABEL"
        description: "First 80 chars of the blocked query (whitespace collapsed)"
    - wait_seconds:
        usage: "GAUGE"
        description: "Seconds the query has been waiting for the lock"
