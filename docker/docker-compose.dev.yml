services:
  snakk:
    volumes:
      - ../src/apps/Snakk.Web/wwwroot:/app/web/wwwroot

  frontend:
    image: node:22
    volumes:
      - ..:/workspace
      - snakk_web_node_modules:/workspace/src/apps/Snakk.Web/node_modules
    working_dir: /workspace/src/apps/Snakk.Web
    command: >
      bash -c "
        npm ci --ignore-scripts &&
        cp node_modules/htmx.org/dist/htmx.min.js wwwroot/js/vendor/htmx.min.js &&
        cp node_modules/htmx.org/dist/ext/head-support.js wwwroot/js/vendor/htmx-head-support.js &&
        cp node_modules/prismjs/themes/prism-tomorrow.min.css wwwroot/css/vendor/prism.css &&
        cp node_modules/dompurify/dist/purify.min.js wwwroot/js/vendor/dompurify.min.js &&
        npm run build:locales &&
        npm run build:editor &&
        npm run build:prism &&
        npm run build:charts &&
        npm run dev
      "

volumes:
  snakk_web_node_modules:
