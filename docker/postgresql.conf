# Snakk PostgreSQL tuning (4GB host, SSD, shared with .NET app containers)

# Accept connections from other Docker containers on the bridge network
# (safe: port is not exposed to host, only via Docker internal DNS)
listen_addresses = '*'

# Memory (conservative — Postgres shares host with app containers)
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 128MB
wal_buffers = 8MB

# Planner (SSD optimizations — no memory cost, just changes query planner behavior)
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL
checkpoint_completion_target = 0.9

# Logging
log_min_duration_statement = 200
log_lock_waits = on
log_checkpoints = on

# Query statistics & plan capture
# pg_stat_statements: aggregates per-query-shape stats (calls, total/mean time).
#   One-time setup after restart: CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
#   Top offenders by total time:
#     SELECT calls, round(total_exec_time)::bigint AS total_ms,
#            round(mean_exec_time, 2) AS mean_ms, rows, left(query, 120) AS query
#     FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;
# auto_explain: logs the actual execution PLAN of any query slower than 500ms.
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = top
auto_explain.log_min_duration = 500
auto_explain.log_analyze = on
auto_explain.log_buffers = on
