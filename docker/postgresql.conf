# Snakk PostgreSQL tuning (4GB host, SSD, shared with .NET app containers)

# Accept connections from other Docker containers on the bridge network
# (safe: port is not exposed to host, only via Docker internal DNS)
listen_addresses = '*'

# Memory (conservative — Postgres shares host with app containers)
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 128MB
wal_buffers = 8MB

# Planner (SSD optimizations — no memory cost, just changes query planner behavior)
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL
checkpoint_completion_target = 0.9
wal_compression = on

# Populates I/O timing columns in pg_stat_statements (blk_read_time/blk_write_time)
# so disk-bound queries can be distinguished from plan-bound ones.
track_io_timing = on

# pg_stat_statements — per-query call/timing stats. Read by postgres-exporter,
# joined into the Snakk Infra dashboard. Requires a server RESTART to take
# effect (shared_preload_libraries is not reload-able), and a one-time
# `CREATE EXTENSION IF NOT EXISTS pg_stat_statements;` in each database.
#   Top offenders by total time:
#     SELECT calls, round(total_exec_time)::bigint AS total_ms,
#            round(mean_exec_time, 2) AS mean_ms, rows, left(query, 120) AS query
#     FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;
# auto_explain: logs the actual execution PLAN of any query slower than 500ms.
# Plans land on the slow-query log stream, so the OTel filelog receiver ships
# them to Loki alongside the statements that triggered them.
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
auto_explain.log_min_duration = 500
auto_explain.log_analyze = on
auto_explain.log_buffers = on
track_io_timing = on

# Logging
log_min_duration_statement = 200
log_lock_waits = on
log_checkpoints = on

# Send the slow-query / lock-wait stream to a file in a shared volume so the
# OTel Collector's filelog receiver can ship it to Loki. Postgres' built-in
# logging_collector subprocess handles rotation. Without this, slow-query lines
# die with the container the moment it restarts.
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on
log_line_prefix = '%m [%p] '
# DEV-ONLY: default file mode is 0600 (owner-only). Loosen to 0644 so the
# otel-collector container (different UID) can read the rotated files. The
# volume is a Docker named volume only mounted by postgres + otel-collector,
# so "world readable" doesn't leak outside the compose project.
#
# *** PROD HARDENING REQUIRED ***
# Slow-query log lines contain SQL text, which can include PII (email
# addresses, user IDs in WHERE clauses, sometimes hashed passwords from
# bad-actor probes). For prod, prefer 0640 + a shared `observability` group
# on the postgres-logs volume so only the collector reads it — never 0644.
# See docs/OBSERVABILITY-OPS-DOS-AND-DONTS.md.
log_file_mode = 0644
