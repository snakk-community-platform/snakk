name: Release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: snakk-community-platform/snakk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Snakk.slnx
        working-directory: src

      - name: Generate locale strings (T.g.cs)
        run: node Locales/gen-strings.mjs
        working-directory: src/apps/Snakk.Web

      - name: Build
        run: dotnet build Snakk.slnx --no-restore -p:SkipFrontendBuild=true
        working-directory: src

      - name: Test
        run: dotnet test --solution Snakk.slnx --no-build --verbosity normal
        working-directory: src

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # When tag is v1.2.3: pushes 1.2.3, 1.2, 1, v1.2.3, latest
          # When tag is non-semver (e.g. release-foo): pushes the literal tag + latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Snakk
            org.opencontainers.image.description=A modern, performant community platform built with .NET 10 and ASP.NET Core
            org.opencontainers.image.url=https://snakk.community
            org.opencontainers.image.documentation=https://github.com/snakk-community-platform/snakk#readme
            org.opencontainers.image.vendor=Snakk Community Platform
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
