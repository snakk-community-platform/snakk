name: Feature Request
description: Suggest a new feature or enhancement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the use case so maintainers can understand why this would be valuable.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem are you trying to solve? Who is affected?
      placeholder: As a community moderator, I want to ... so that ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Feel free to sketch UX, API shape, or architecture.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about, and why they fall short?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Snakk.Web (main platform)
        - Snakk.Admin (admin panel)
        - Snakk.Auth (login / OAuth)
        - Snakk.Api (internal gRPC / REST)
        - Snakk.Realtime (SignalR)
        - Snakk.Gateway (YARP)
        - Database schema
        - Docker / deployment
        - Documentation
        - Cross-cutting / not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links to similar features elsewhere, etc.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: This aligns with the project's goals as described in the README.
          required: false
