syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Snakk.Protos.Auth";

package snakk.auth;

// Auth service — handles login, registration, token refresh, user profile
service AuthService {
  // Authentication
  rpc Register (RegisterRequest) returns (AuthTokenResponse);
  rpc Login (LoginRequest) returns (AuthTokenResponse);
  rpc Logout (LogoutRequest) returns (MessageResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc VerifyEmail (VerifyEmailRequest) returns (MessageResponse);

  // Auth status & user info
  rpc GetAuthStatus (GetAuthStatusRequest) returns (AuthStatusResponse);
  rpc GetCurrentUser (GetCurrentUserRequest) returns (CurrentUserResponse);

  // Profile & preferences
  rpc GetDisplayNameHistory (GetDisplayNameHistoryRequest) returns (DisplayNameHistoryResponse);
  rpc UpdateProfile (UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc UpdatePreferences (UpdatePreferencesRequest) returns (MessageResponse);

  // OAuth (server-to-server only — challenge/callback stay as HTTP redirects)
  rpc OAuthCallback (OAuthCallbackRequest) returns (OAuthCallbackResponse);

  // Public site settings (no auth required)
  rpc GetPublicSettings (GetPublicSettingsRequest) returns (PublicSettingsResponse);
}

// --- Request Messages ---

message RegisterRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
  string base_url = 4; // For email verification link
  optional string turnstile_token = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string ip_address = 3;  // Forwarded from caller for audit
  string user_agent = 4;  // Forwarded from caller for audit
  optional string turnstile_token = 5;
}

message LogoutRequest {
  // User ID comes from JWT metadata (authorization header)
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message VerifyEmailRequest {
  string token = 1;
}

message GetAuthStatusRequest {
  // User info comes from JWT metadata
}

message GetCurrentUserRequest {
  // User info comes from JWT metadata
}

message UpdateProfileRequest {
  string display_name = 1;
  optional string password = 2;
  optional string turnstile_token = 3;
}

message UpdatePreferencesRequest {
  optional bool auto_follow_on_reply = 2;
  optional string timezone = 3;
  optional string bio = 4;
}

message OAuthCallbackRequest {
  string provider = 1;
  string provider_user_id = 2;
  string email = 3;
  string display_name = 4;
  string ip_address = 5;
  string user_agent = 6;
}

// --- Response Messages ---

message AuthTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  UserInfo user = 3;
  string message = 4; // Optional message (e.g., "Please verify email")
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message AuthStatusResponse {
  bool is_authenticated = 1;
  optional string public_id = 2;
  optional string display_name = 3;
  optional bool email_verified = 4;
  optional string role = 5;
  optional string avatar_url = 6;
}

message CurrentUserResponse {
  string public_id = 1;
  string display_name = 2;
  string email = 3;
  bool email_verified = 4;
  optional string oauth_provider = 5;
  bool auto_follow_on_reply = 7;
  bool is_authenticated = 8; // False when anonymous — mirrors AuthStatusResponse pattern
  optional string timezone = 9;
  optional google.protobuf.Timestamp display_name_changed_at = 10;
  bool is_display_name_locked = 11;
  bool has_password = 12;
  optional string avatar_url = 13;
  optional string bio = 14;
}

message UpdateProfileResponse {
  string message = 1;
  optional string token = 2; // New JWT with updated display name
  bool success = 3;
  optional string error_code = 4; // COOLDOWN, LOCKED, RESERVED, INVALID_PASSWORD, CAPTCHA_FAILED, TAKEN, HISTORY
}

message OAuthCallbackResponse {
  string access_token = 1;
  string refresh_token = 2;
  bool is_new_user = 3;
  UserInfo user = 4;
}

message UserInfo {
  string id = 1;
  string email = 2;
  string display_name = 3;
  bool email_verified = 4;
  repeated string roles = 5;
}

message MessageResponse {
  string message = 1;
}

message GetPublicSettingsRequest {}

message PublicSettingsResponse {
  string timezone = 1;
  string site_name = 2;
}

message GetDisplayNameHistoryRequest {}

message DisplayNameHistoryEntry {
  string previous_name = 1;
  string new_name = 2;
  google.protobuf.Timestamp changed_at = 3;
}

message DisplayNameHistoryResponse {
  repeated DisplayNameHistoryEntry entries = 1;
}
