syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Snakk.Protos.Auth";

package snakk.auth;

// Auth service — handles login, registration, token refresh, user profile
service AuthService {
  // Authentication
  rpc Register (RegisterRequest) returns (AuthTokenResponse);
  rpc Login (LoginRequest) returns (AuthTokenResponse);
  rpc Logout (LogoutRequest) returns (MessageResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc VerifyEmail (VerifyEmailRequest) returns (MessageResponse);

  // Auth status & user info
  rpc GetAuthStatus (GetAuthStatusRequest) returns (AuthStatusResponse);
  rpc GetCurrentUser (GetCurrentUserRequest) returns (CurrentUserResponse);

  // Profile & preferences
  rpc GetDisplayNameHistory (GetDisplayNameHistoryRequest) returns (DisplayNameHistoryResponse);
  rpc UpdateProfile (UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc UpdatePreferences (UpdatePreferencesRequest) returns (MessageResponse);
  rpc SetEmail (SetEmailRequest) returns (SetEmailResponse);

  // RSS feed token
  rpc GenerateFeedToken (GenerateFeedTokenRequest) returns (FeedTokenResponse);
  rpc RevokeFeedToken (RevokeFeedTokenRequest) returns (MessageResponse);

  // Discord account linking (separate from OAuth login)
  rpc GenerateDiscordLinkToken (GenerateDiscordLinkTokenRequest) returns (GenerateDiscordLinkTokenResponse);
  rpc CompleteDiscordLink       (CompleteDiscordLinkRequest)       returns (CompleteDiscordLinkResponse);
  rpc UnlinkDiscord             (UnlinkDiscordRequest)             returns (MessageResponse);
  rpc GetDiscordStatus          (GetDiscordStatusRequest)          returns (DiscordStatusResponse);

  // OAuth (server-to-server only — challenge/callback stay as HTTP redirects)
  rpc OAuthCallback (OAuthCallbackRequest) returns (OAuthCallbackResponse);

  // OAuth connected accounts management
  rpc GetOAuthConnections          (GetOAuthConnectionsRequest)          returns (GetOAuthConnectionsResponse);
  rpc ConnectOAuthProvider         (ConnectOAuthProviderRequest)         returns (ConnectOAuthProviderResponse);
  rpc DisconnectOAuthProvider      (DisconnectOAuthProviderRequest)      returns (MessageResponse);
  rpc SetOAuthConnectionRequire2FA (SetOAuthConnectionRequire2FARequest) returns (MessageResponse);

  // OAuth sudo re-authentication nonce (called by Snakk.Auth after popup callback)
  rpc GenerateOAuthSudoNonce (GenerateOAuthSudoNonceRequest) returns (GenerateOAuthSudoNonceResponse);

  // Public site settings (no auth required)
  rpc GetPublicSettings (GetPublicSettingsRequest) returns (PublicSettingsResponse);

  // Password recovery (no auth required)
  rpc RequestPasswordReset (RequestPasswordResetRequest) returns (MessageResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (MessageResponse);
}

// --- Request Messages ---

message RegisterRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
  string base_url = 4; // For email verification link
  optional string turnstile_token = 5;
  optional string invite_code = 6;
  // Tri-state adult-content choice forced at registration: true = consent, false = decline.
  optional bool allow_adult_content = 7;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string ip_address = 3;  // Forwarded from caller for audit
  string user_agent = 4;  // Forwarded from caller for audit
  optional string turnstile_token = 5;
}

message LogoutRequest {
  // User ID comes from JWT metadata (authorization header)
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message VerifyEmailRequest {
  string token = 1;
}

message GetAuthStatusRequest {
  // User info comes from JWT metadata
}

message GetCurrentUserRequest {
  // User info comes from JWT metadata
}

message UpdateProfileRequest {
  string display_name = 1;
  optional string password = 2;
  optional string turnstile_token = 3;
  optional string sudo_token = 4;
}

message UpdatePreferencesRequest {
  optional bool auto_follow_on_reply = 2;
  optional string timezone = 3;
  optional string bio = 4;
  optional bool allow_adult_content = 5;
  // When true, clears the adult content preference back to "ask"; ignored when false.
  bool reset_adult_content_to_ask = 6;
  // 0=Show, 1=Blur, 2=Hide
  optional int32 adult_preview_image_mode = 7;
  // When true, user appears anonymous in viewer/typing presence lists
  optional bool hide_presence = 8;
}

message OAuthCallbackRequest {
  string provider = 1;
  string provider_user_id = 2;
  string email = 3;
  string display_name = 4;
  string ip_address = 5;
  string user_agent = 6;
  optional string invite_code = 7;
  // Tri-state adult-content choice (set during profile setup, not OAuth challenge).
  optional bool allow_adult_content = 8;
}

// --- Response Messages ---

message AuthTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  UserInfo user = 3;
  string message = 4; // Optional message (e.g., "Please verify email")
  bool two_factor_required = 5;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  bool needs_consent = 3;
}

message AuthStatusResponse {
  bool is_authenticated = 1;
  optional string public_id = 2;
  optional string display_name = 3;
  optional bool email_verified = 4;
  optional string role = 5;
  optional string avatar_url = 6;
}

message CurrentUserResponse {
  string public_id = 1;
  string display_name = 2;
  string email = 3;
  bool email_verified = 4;
  repeated string connected_providers = 5;
  bool auto_follow_on_reply = 7;
  bool is_authenticated = 8; // False when anonymous — mirrors AuthStatusResponse pattern
  optional string timezone = 9;
  optional google.protobuf.Timestamp display_name_changed_at = 10;
  bool is_display_name_locked = 11;
  bool has_password = 12;
  optional string avatar_url = 13;
  optional string bio = 14;
  optional string feed_token = 15;
  optional bool allow_adult_content = 16;
  int32 adult_preview_image_mode = 17; // 0=Show, 1=Blur, 2=Hide
  bool hide_presence = 18;
}

message UpdateProfileResponse {
  string message = 1;
  optional string token = 2; // New JWT with updated display name
  bool success = 3;
  optional string error_code = 4; // COOLDOWN, LOCKED, RESERVED, INVALID_PASSWORD, CAPTCHA_FAILED, TAKEN, HISTORY
}

message OAuthCallbackResponse {
  string access_token = 1;
  string refresh_token = 2;
  bool is_new_user = 3;
  UserInfo user = 4;
  bool two_factor_required = 5;
}

message UserInfo {
  string id = 1;
  optional string email = 2;
  optional string display_name = 3;
  bool email_verified = 4;
  repeated string roles = 5;
}

message MessageResponse {
  string message = 1;
}

message GetPublicSettingsRequest {}

message PublicSettingsResponse {
  string timezone = 1;
  string site_name = 2;
  string registration_mode = 3;
}

message GetDisplayNameHistoryRequest {}

message DisplayNameHistoryEntry {
  string previous_name = 1;
  string new_name = 2;
  google.protobuf.Timestamp changed_at = 3;
}

message DisplayNameHistoryResponse {
  repeated DisplayNameHistoryEntry entries = 1;
}

// RSS feed token
message GenerateFeedTokenRequest {}
message RevokeFeedTokenRequest {}
message FeedTokenResponse {
  string token = 1;
}

// Discord account linking
message GenerateDiscordLinkTokenRequest {}
message GenerateDiscordLinkTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message CompleteDiscordLinkRequest {
  string link_token = 1;
  string discord_user_id = 2;
  string discord_username = 3;
  optional string discord_avatar_hash = 4;
}
message CompleteDiscordLinkResponse {
  bool success = 1;
  optional string error_code = 2;
}

message UnlinkDiscordRequest {}
message GetDiscordStatusRequest {}

// Password recovery
message RequestPasswordResetRequest {
  string email = 1;
  string base_url = 2;
  string ip_address = 3;
  string user_agent = 4;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
  string ip_address = 3;
  string user_agent = 4;
}
message DiscordStatusResponse {
  bool is_linked = 1;
  optional string discord_username = 2;
  optional string discord_user_id = 3;
  optional string discord_avatar_hash = 4;
}

// OAuth connected accounts
message OAuthConnectionInfo {
  string provider = 1;
  google.protobuf.Timestamp connected_at = 2;
  optional google.protobuf.Timestamp last_login_at = 3;
  bool require_2fa = 4;
}

message GetOAuthConnectionsRequest {}
message GetOAuthConnectionsResponse {
  repeated OAuthConnectionInfo connections = 1;
}

message ConnectOAuthProviderRequest {
  string provider = 1;
  string provider_user_id = 2;
  optional string user_public_id = 3; // set by Snakk.Auth (server-to-server); omit for BFF calls (uses JWT)
}
message ConnectOAuthProviderResponse {
  bool success = 1;
  optional string error_code = 2;
}

message DisconnectOAuthProviderRequest {
  string provider = 1;
}

message SetOAuthConnectionRequire2FARequest {
  string provider = 1;
  bool require_2fa = 2;
}

// OAuth sudo nonce
message GenerateOAuthSudoNonceRequest {
  string user_public_id = 1;
  string provider = 2;
  string provider_user_id = 3;
}
message GenerateOAuthSudoNonceResponse {
  string nonce = 1;
}

message SetEmailRequest {
  string email = 1;
}
message SetEmailResponse {
  string token = 1;
}
