syntax = "proto3";

option csharp_namespace = "Snakk.Protos.Space";

package snakk.space;

import "google/protobuf/timestamp.proto";

service SpaceService {
  rpc GetSpaceBySlug (GetSpaceBySlugRequest) returns (SpaceInfo);
  rpc GetSpace (GetSpaceRequest) returns (SpaceInfo);
  rpc ListSpacesByHub (ListSpacesByHubRequest) returns (PagedSpaceByHubList);
  rpc SearchSpaces (SearchSpacesRequest) returns (SearchSpacesResponse);
  rpc GetSpaceRules (GetSpaceRulesRequest) returns (SpaceRulesResponse);
  rpc GetSpaceStats (GetSpaceStatsRequest) returns (SpaceStats);
}

// --- Requests ---

message GetSpaceBySlugRequest {
  string slug = 1;
  string hub_slug = 2;
}

message GetSpaceRequest {
  string public_id = 1;
}

message ListSpacesByHubRequest {
  string hub_id = 1;
  int32 offset = 2;
  int32 page_size = 3;
}

message GetSpaceRulesRequest {
  string space_id = 1;
}

message GetSpaceStatsRequest {
  string public_id = 1;
}

// --- Responses ---

message SpaceInfo {
  string public_id = 1;
  string hub_id = 2;
  string name = 3;
  string slug = 4;
  optional string description = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 discussion_count = 7;
  int32 reply_count = 8;
  optional google.protobuf.Timestamp last_modified_at = 9;
  optional LatestDiscussionRef latest_discussion = 10;
  bool has_rules = 11;
  string rules_revision = 12;
  bool parent_hub_has_rules = 13;
  bool parent_community_has_rules = 14;
  repeated int32 allowed_discussion_types = 15;
  string team_revision = 16;
  bool is_restricted = 17;
  string hub_slug = 18;
  string community_slug = 19;
  optional string avatar_file_name = 20;
  optional string avatar_thumbnail_file_name = 21;
  bool is_adult_only = 22;
  bool allows_adult_content = 23;
}

message LatestDiscussionRef {
  string public_id = 1;
  string title = 2;
  string slug = 3;
  google.protobuf.Timestamp last_activity_at = 4;
  string author_public_id = 5;
  string author_display_name = 6;
  optional string author_avatar_file_name = 7;
  int32 post_count = 8;
}

message SpaceByHubInfo {
  string public_id = 1;
  string hub_public_id = 2;
  string name = 3;
  string slug = 4;
  optional string description = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 discussion_count = 7;
  int32 reply_count = 8;
  optional LatestDiscussionRef latest_discussion = 9;
  optional string avatar_file_name = 10;
}

message PagedSpaceByHubList {
  repeated SpaceByHubInfo items = 1;
  int32 offset = 2;
  int32 page_size = 3;
  bool has_more_items = 4;
}

message SpaceRulesResponse {
  repeated SpaceRule rules = 1;
}

message SpaceRule {
  int32 id = 1;
  string title = 2;
  string description = 3;
  int32 order = 4;
}

message SpaceStats {
  string public_id = 1;
  string name = 2;
  optional string description = 3;
  string avatar_url = 4;
  int32 discussion_count = 5;
  int32 reply_count = 6;
  int32 follower_count = 7;
}

// --- Space search (for new-discussion space selector) ---

message SearchSpacesRequest {
  optional string query = 1;
  optional string hub_id = 2;
  optional string community_id = 3;
  int32 limit = 4;
}

message SearchSpacesResponse {
  repeated SpaceSearchItem items = 1;
}

message SpaceSearchItem {
  string public_id = 1;
  string name = 2;
  string slug = 3;
  string hub_slug = 4;
  string hub_name = 5;
  string community_slug = 6;
  int32 discussion_count = 7;
  string community_name = 8;
  string avatar_url = 9;
}
