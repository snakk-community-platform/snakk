syntax = "proto3";

option csharp_namespace = "Snakk.Protos.Space";

package snakk.space;

import "Protos/common.proto";
import "google/protobuf/timestamp.proto";

service SpaceService {
  rpc GetSpaceBySlug (GetSpaceBySlugRequest) returns (SpaceInfo);
  rpc GetSpace (GetSpaceRequest) returns (SpaceInfo);
  rpc ListSpacesByHub (ListSpacesByHubRequest) returns (PagedSpaceByHubList);
  rpc GetSpaceRules (GetSpaceRulesRequest) returns (SpaceRulesResponse);
  rpc GetSpaceStats (GetSpaceStatsRequest) returns (SpaceStats);
}

// --- Requests ---

message GetSpaceBySlugRequest {
  string slug = 1;
}

message GetSpaceRequest {
  string public_id = 1;
}

message ListSpacesByHubRequest {
  string hub_id = 1;
  int32 offset = 2;
  int32 page_size = 3;
}

message GetSpaceRulesRequest {
  string space_id = 1;
}

message GetSpaceStatsRequest {
  string public_id = 1;
}

// --- Responses ---

message SpaceInfo {
  string public_id = 1;
  string hub_id = 2;
  string name = 3;
  string slug = 4;
  optional string description = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 discussion_count = 7;
  int32 reply_count = 8;
  optional google.protobuf.Timestamp last_modified_at = 9;
  optional LatestDiscussionRef latest_discussion = 10;
  bool has_rules = 11;
  string rules_revision = 12;
  bool parent_hub_has_rules = 13;
  bool parent_community_has_rules = 14;
}

message LatestDiscussionRef {
  string public_id = 1;
  string title = 2;
  string slug = 3;
  google.protobuf.Timestamp last_activity_at = 4;
  string author_public_id = 5;
  string author_display_name = 6;
  optional string author_avatar_file_name = 7;
  int32 post_count = 8;
}

message SpaceByHubInfo {
  string public_id = 1;
  string hub_public_id = 2;
  string name = 3;
  string slug = 4;
  optional string description = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 discussion_count = 7;
  int32 reply_count = 8;
  optional LatestDiscussionRef latest_discussion = 9;
}

message PagedSpaceByHubList {
  repeated SpaceByHubInfo items = 1;
  int32 offset = 2;
  int32 page_size = 3;
  bool has_more_items = 4;
}

message SpaceRulesResponse {
  repeated SpaceRule rules = 1;
}

message SpaceRule {
  int32 id = 1;
  string title = 2;
  string description = 3;
  int32 order = 4;
}

message SpaceStats {
  string public_id = 1;
  string name = 2;
  optional string description = 3;
  string avatar_url = 4;
  int32 discussion_count = 5;
  int32 reply_count = 6;
  int32 follower_count = 7;
}
