syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Snakk.Protos.Passkey";

package snakk.passkey;

service PasskeyService {
  rpc BeginPasskeyRegistration (BeginPasskeyRegistrationRequest) returns (BeginPasskeyRegistrationResponse);
  rpc CompletePasskeyRegistration (CompletePasskeyRegistrationRequest) returns (PasskeyMessageResponse);
  rpc BeginPasskeyLogin (BeginPasskeyLoginRequest) returns (BeginPasskeyLoginResponse);
  rpc CompletePasskeyLogin (CompletePasskeyLoginRequest) returns (PasskeyLoginResponse);
  rpc GetUserPasskeys (GetUserPasskeysRequest) returns (GetUserPasskeysResponse);
  rpc DeletePasskey (DeletePasskeyRequest) returns (PasskeyMessageResponse);
}

// --- Registration ---

message BeginPasskeyRegistrationRequest {
  string user_public_id = 1;
  string user_display_name = 2;
}

message BeginPasskeyRegistrationResponse {
  string options_json = 1;
  string challenge_id = 2;
}

message CompletePasskeyRegistrationRequest {
  string user_public_id = 1;
  string challenge_id = 2;
  string attestation_response_json = 3;
  optional string friendly_name = 4;
}

// --- Login ---

message BeginPasskeyLoginRequest {
  optional string email = 1;
}

message BeginPasskeyLoginResponse {
  string options_json = 1;
  string challenge_id = 2;
}

message CompletePasskeyLoginRequest {
  string challenge_id = 1;
  string assertion_response_json = 2;
  string ip_address = 3;
  string user_agent = 4;
}

message PasskeyLoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  string error = 3;
  bool two_factor_required = 4;
  string email = 5;
}

// --- Management ---

message GetUserPasskeysRequest {
  string user_public_id = 1;
}

message GetUserPasskeysResponse {
  repeated PasskeyInfo passkeys = 1;
}

message PasskeyInfo {
  int32 id = 1;
  string friendly_name = 2;
  google.protobuf.Timestamp created_at = 3;
  optional google.protobuf.Timestamp last_used_at = 4;
  string transports = 5;
}

message DeletePasskeyRequest {
  string user_public_id = 1;
  int32 credential_id = 2;
}

message PasskeyMessageResponse {
  string message = 1;
}
