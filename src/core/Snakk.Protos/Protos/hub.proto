syntax = "proto3";

option csharp_namespace = "Snakk.Protos.Hub";

package snakk.hub;

import "google/protobuf/timestamp.proto";

service HubService {
  rpc GetHubBySlug (GetHubBySlugRequest) returns (HubInfo);
  rpc GetHub (GetHubRequest) returns (HubInfo);
  rpc ListHubs (ListHubsRequest) returns (PagedHubList);
  rpc ListHubsByCommunity (ListHubsByCommunityRequest) returns (PagedHubList);
  rpc GetHubStats (GetHubStatsRequest) returns (HubStats);
  rpc GetHubRules (GetHubRulesRequest) returns (HubRulesResponse);
}

// --- Requests ---

message GetHubBySlugRequest {
  string slug = 1;
  string community_slug = 2;
}

message GetHubRequest {
  string public_id = 1;
}

message ListHubsRequest {
  int32 offset = 1;
  int32 page_size = 2;
}

message ListHubsByCommunityRequest {
  string community_id = 1;
  int32 offset = 2;
  int32 page_size = 3;
}

message GetHubStatsRequest {
  string public_id = 1;
}

// --- Responses ---

message HubInfo {
  string public_id = 1;
  string community_id = 2;
  string name = 3;
  string slug = 4;
  optional string description = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 space_count = 7;
  int32 discussion_count = 8;
  int32 reply_count = 9;
  optional google.protobuf.Timestamp last_modified_at = 10;
  bool has_rules = 11;
  string rules_revision = 12;
  bool parent_community_has_rules = 13;
  string team_revision = 14;
  bool is_restricted = 15;
  string community_slug = 16;
  optional string avatar_file_name = 17;
  bool require_2fa = 18;
}

message PagedHubList {
  repeated HubInfo items = 1;
  int32 offset = 2;
  int32 page_size = 3;
  bool has_more_items = 4;
}

message GetHubRulesRequest {
  string hub_id = 1;
}

message HubRulesResponse {
  repeated HubRule rules = 1;
}

message HubRule {
  int32 id = 1;
  string title = 2;
  string description = 3;
  int32 order = 4;
}

message HubStats {
  string public_id = 1;
  string name = 2;
  optional string description = 3;
  string avatar_url = 4;
  int32 space_count = 5;
  int32 discussion_count = 6;
  int32 reply_count = 7;
}
