syntax = "proto3";

option csharp_namespace = "Snakk.Protos.Community";

package snakk.community;

import "google/protobuf/timestamp.proto";

service CommunityService {
  rpc GetCommunityBySlug (GetCommunityBySlugRequest) returns (CommunityInfo);
  rpc GetCommunityByDomain (GetCommunityByDomainRequest) returns (CommunityInfo);
  rpc GetCommunity (GetCommunityRequest) returns (CommunityInfo);
  rpc ListCommunities (ListCommunitiesRequest) returns (PagedCommunityList);
  rpc GetCommunityStats (GetCommunityStatsRequest) returns (CommunityStats);
  rpc GetCommunityRules (GetCommunityRulesRequest) returns (CommunityRulesResponse);
}

// --- Requests ---

message GetCommunityBySlugRequest {
  string slug = 1;
}

message GetCommunityByDomainRequest {
  string domain = 1;
}

message GetCommunityRequest {
  string public_id = 1;
}

message ListCommunitiesRequest {
  int32 offset = 1;
  int32 page_size = 2;
}

message GetCommunityStatsRequest {
  string public_id = 1;
}

// --- Responses ---

message CommunityInfo {
  string public_id = 1;
  string name = 2;
  string slug = 3;
  optional string description = 4;
  string visibility = 5;
  bool expose_to_platform_feed = 6;
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp last_modified_at = 8;
  bool has_rules = 9;
  string rules_revision = 10;
}

message GetCommunityRulesRequest {
  string community_id = 1;
}

message CommunityRulesResponse {
  repeated CommunityRule rules = 1;
}

message CommunityRule {
  int32 id = 1;
  string title = 2;
  string description = 3;
  int32 order = 4;
}

message PagedCommunityList {
  repeated CommunityInfo items = 1;
  int32 offset = 2;
  int32 page_size = 3;
  bool has_more_items = 4;
}

message CommunityStats {
  string public_id = 1;
  string name = 2;
  optional string description = 3;
  string avatar_url = 4;
  int32 hub_count = 5;
  int32 space_count = 6;
  int32 discussion_count = 7;
  int32 reply_count = 8;
}
