syntax = "proto3";

option csharp_namespace = "Snakk.Protos.Statistics";

package snakk.statistics;

import "Protos/common.proto";

service StatisticsService {
  // Platform-level stats
  rpc GetPlatformStats (GetPlatformStatsRequest) returns (PlatformStats);

  // Top active / trending
  rpc GetTopActiveDiscussionsToday (GetTopActiveDiscussionsTodayRequest) returns (TopActiveDiscussionsList);
  rpc GetTopActiveSpacesToday (GetTopActiveSpacesTodayRequest) returns (TopActiveSpacesList);
  rpc GetTopContributorsToday (GetTopContributorsTodayRequest) returns (TopContributorsList);

  // Trending (7-day window)
  rpc GetTrendingSpaces (GetTrendingSpacesRequest) returns (TopActiveSpacesList);
  rpc GetTrendingContributors (GetTrendingContributorsRequest) returns (TopContributorsList);

  // Top by time period
  rpc GetTopSpacesByPeriod (GetTopSpacesByPeriodRequest) returns (TopActiveSpacesList);
  rpc GetTopContributorsByPeriod (GetTopContributorsByPeriodRequest) returns (TopContributorsList);

  // Latest (most recently active)
  rpc GetLatestActiveSpaces (GetLatestActiveSpacesRequest) returns (LatestSpacesList);
  rpc GetLatestContributors (GetLatestContributorsRequest) returns (LatestContributorsList);

  // User activity
  rpc GetUserActivityHistory (GetUserActivityHistoryRequest) returns (UserActivityHistory);
  rpc GetUserStats (GetUserStatsRequest) returns (UserStats);

  // Activity sparklines (pre-aggregated daily snapshots)
  rpc GetActivitySparkline (SparklineRequest) returns (SparklineResponse);
  rpc GetActivitySparklinesBatch (SparklineBatchRequest) returns (SparklineBatchResponse);
}

// --- Requests ---

message GetPlatformStatsRequest {}

message GetTopActiveDiscussionsTodayRequest {
  optional string hub_id = 1;
  optional string space_id = 2;
  optional string community_id = 3;
  int32 limit = 4;
  bool viewer_allows_adult = 5;
}

message GetTopActiveSpacesTodayRequest {
  optional string hub_id = 1;
  optional string community_id = 2;
  int32 limit = 3;
}

message GetTopContributorsTodayRequest {
  optional string hub_id = 1;
  optional string space_id = 2;
  optional string community_id = 3;
  int32 limit = 4;
}

message GetTrendingSpacesRequest {
  optional string hub_id = 1;
  optional string community_id = 2;
  int32 limit = 3;
}

message GetTrendingContributorsRequest {
  optional string hub_id = 1;
  optional string space_id = 2;
  optional string community_id = 3;
  int32 limit = 4;
}

message GetTopSpacesByPeriodRequest {
  string time_period = 1;
  optional string hub_id = 2;
  optional string community_id = 3;
  int32 limit = 4;
}

message GetTopContributorsByPeriodRequest {
  string time_period = 1;
  optional string hub_id = 2;
  optional string space_id = 3;
  optional string community_id = 4;
  int32 limit = 5;
}

message GetLatestActiveSpacesRequest {
  optional string hub_id = 1;
  optional string community_id = 2;
  int32 limit = 3;
}

message GetLatestContributorsRequest {
  optional string hub_id = 1;
  optional string space_id = 2;
  optional string community_id = 3;
  int32 limit = 4;
}

message GetUserActivityHistoryRequest {
  string public_id = 1;
  int32 days = 2;
}

message GetUserStatsRequest {
  string public_id = 1;
}

// --- Responses ---

message PlatformStats {
  int32 hub_count = 1;
  int32 space_count = 2;
  int32 discussion_count = 3;
  int32 reply_count = 4;
}

message TopActiveDiscussionInfo {
  string public_id = 1;
  string title = 2;
  string slug = 3;
  int32 post_count_today = 4;
  snakk.EntityRef space = 5;
  snakk.EntityRef hub = 6;
  snakk.AuthorRef author = 7;
  string community_slug = 8;
}

message TopActiveDiscussionsList {
  repeated TopActiveDiscussionInfo items = 1;
}

message TopActiveSpaceInfo {
  string public_id = 1;
  string name = 2;
  string slug = 3;
  int32 post_count_today = 4;
  snakk.EntityRef hub = 5;
  string community_slug = 6;
}

message TopActiveSpacesList {
  repeated TopActiveSpaceInfo items = 1;
}

message TopContributorInfo {
  string public_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  int32 post_count_today = 4;
  optional string avatar_thumbnail_url = 5;
  optional string avatar_micro_url = 6;
}

message TopContributorsList {
  repeated TopContributorInfo items = 1;
}

message ActivityDay {
  string date = 1;
  int32 discussions = 2;
  int32 posts = 3;
  int32 total = 4;
}

message UserActivityHistory {
  int32 days = 1;
  repeated ActivityDay data = 2;
}

message UserStats {
  string public_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  int32 discussion_count = 4;
  int32 reply_count = 5;
  int32 follower_count = 6;
  int32 following_count = 7;
  optional string bio = 8;
  optional string avatar_thumbnail_url = 9;
}

message LatestSpaceInfo {
  string public_id = 1;
  string name = 2;
  string slug = 3;
  string last_post_at = 4;
  snakk.EntityRef hub = 5;
  string community_slug = 6;
}

message LatestSpacesList {
  repeated LatestSpaceInfo items = 1;
}

message LatestContributorInfo {
  string public_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  string last_post_at = 4;
  optional string avatar_thumbnail_url = 5;
  optional string avatar_micro_url = 6;
}

message LatestContributorsList {
  repeated LatestContributorInfo items = 1;
}

// --- Activity sparklines ---

message SparklineRequest {
  string entity_type = 1; // "platform" | "community" | "hub" | "space" | "discussion"
  string public_id   = 2; // empty for platform
  int32  days        = 3;
}

message SparklineBatchRequest {
  repeated string public_ids = 1; // space PublicIds
  int32 days = 2;
}

message SpaceSparklineEntry {
  string public_id = 1;
  repeated SparklineDay days = 2;
}

message SparklineBatchResponse {
  repeated SpaceSparklineEntry entries = 1;
}

message SparklineDay {
  string date             = 1; // ISO date "2026-04-15"
  int32  post_count       = 2;
  int32  discussion_count = 3;
}

message SparklineResponse {
  repeated SparklineDay days = 1;
}
