syntax = "proto3";

option csharp_namespace = "Snakk.Protos";

package snakk;

import "google/protobuf/timestamp.proto";

// Generic paged result wrapper
message PagedResult {
  int32 offset = 1;
  int32 page_size = 2;
  bool has_more_items = 3;
  optional string next_cursor = 4;
}

// Generic error response
message ErrorResponse {
  string error = 1;
}

// Empty request/response for simple RPCs
message Empty {}

// Generic message response (e.g., "Logged out successfully")
message MessageResponse {
  string message = 1;
}

// Generic success response
message SuccessResponse {
  bool success = 1;
  optional int32 processed = 2;
}

// --- Shared reference types (used across multiple services) ---

// Lightweight reference to an entity (hub, space, community)
message EntityRef {
  string public_id = 1;
  string slug = 2;
  string name = 3;
  optional string avatar_url = 4;
}

// Lightweight reference to a user (author of a post, discussion, etc.)
message AuthorRef {
  string public_id = 1;
  string display_name = 2;
  optional string avatar_url = 3;
  optional string role = 4;
  bool is_deleted = 5;
  optional google.protobuf.Timestamp joined_at = 6;
  int32 discussion_count = 7;
  int32 reply_count = 8;
}

// Reference to a post being replied to
message ReplyToRef {
  string author_name = 1;
  string content_snippet = 2;
}

// Reaction counts (dictionary of type name → count)
message ReactionCounts {
  map<string, int32> counts = 1;
}

// User's active reactions on a post
message UserReactions {
  repeated string reactions = 1;
}
