syntax = "proto3";

option csharp_namespace = "Snakk.Protos.User";

package snakk.user;

import "google/protobuf/timestamp.proto";

service UserService {
  rpc GetUserProfile (GetUserProfileRequest) returns (UserProfileInfo);
  rpc GetUserBySlug (GetUserBySlugRequest) returns (UserProfileInfo);
  rpc ResolveOldSlug (ResolveOldSlugRequest) returns (ResolveOldSlugResponse);
  rpc SearchUsers (SearchUsersRequest) returns (UserSearchResults);
}

// --- Requests ---

message GetUserProfileRequest {
  string public_id = 1;
}

message GetUserBySlugRequest {
  string slug = 1;
}

message ResolveOldSlugRequest {
  string old_slug = 1;
}

message SearchUsersRequest {
  string query = 1;
  int32 limit = 2;
}

// --- Responses ---

message ResolveOldSlugResponse {
  bool found = 1;
  optional string current_slug = 2;
}

message UserProfileInfo {
  string public_id = 1;
  string display_name = 2;
  optional string avatar_file_name = 3;
  google.protobuf.Timestamp joined_at = 4;
  optional google.protobuf.Timestamp last_seen_at = 5;
  int32 discussion_count = 6;
  int32 post_count = 7;
  int32 follower_count = 8;
  int32 reply_count = 9;
  optional string bio = 10;
  int32 following_count = 11;
  int32 reactions_received = 12;
  repeated UserAchievementInfo achievements = 13;
  repeated TopDiscussionInfo top_discussions = 14;
  repeated TopSpaceInfo top_spaces = 15;
  optional string avatar_thumbnail_file_name = 16;
  optional string discord_user_id  = 17;
  optional string discord_username = 18;
  optional string slug = 19;
  bool is_global_admin = 20;
}

message UserAchievementInfo {
  string slug = 1;
  string name = 2;
  string description = 3;
  optional string icon_url = 4;
  string category = 5;
  string tier = 6;
  int32 points = 7;
  google.protobuf.Timestamp earned_at = 8;
}

message TopDiscussionInfo {
  string public_id = 1;
  string title = 2;
  string slug = 3;
  int32 post_count = 4;
  int32 reaction_count = 5;
  google.protobuf.Timestamp created_at = 6;
  string space_slug = 7;
  string space_name = 8;
  string hub_slug = 9;
  string hub_name = 10;
  string community_slug = 11;
  string community_name = 12;
}

message TopSpaceInfo {
  string public_id = 1;
  string space_slug = 2;
  string space_name = 3;
  optional string space_avatar_file_name = 4;
  string hub_slug = 5;
  string community_slug = 6;
  int32 post_count = 7;
}

message UserSearchResultItem {
  string public_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  optional string avatar_thumbnail_url = 4;
  optional string slug = 5;
}

message UserSearchResults {
  repeated UserSearchResultItem items = 1;
}
