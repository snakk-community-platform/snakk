syntax = "proto3";

option csharp_namespace = "Snakk.Protos.Search";

package snakk.search;

import "Protos/common.proto";
import "google/protobuf/timestamp.proto";

service SearchService {
  rpc SearchDiscussions (SearchDiscussionsRequest) returns (PagedDiscussionSearchResults);
  rpc SearchPosts (SearchPostsRequest) returns (PagedPostSearchResults);
  rpc GetSitemapDiscussions (SitemapRequest) returns (SitemapResponse);
}

// --- Requests ---

message SearchDiscussionsRequest {
  string query = 1;
  optional string author_id = 2;
  optional string space_id = 3;
  optional string hub_id = 4;
  int32 offset = 5;
  int32 page_size = 6;
}

message SearchPostsRequest {
  string query = 1;
  optional string author_id = 2;
  optional string discussion_id = 3;
  optional string space_id = 4;
  int32 offset = 5;
  int32 page_size = 6;
}

// --- Responses ---

message DiscussionSearchResult {
  string public_id = 1;
  string title = 2;
  string slug = 3;
  string highlight = 4;
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp last_activity_at = 6;
  snakk.EntityRef space = 7;
  snakk.EntityRef hub = 8;
  snakk.AuthorRef author = 9;
  int32 post_count = 10;
  int32 reaction_count = 11;
  string community_slug = 12;
}

message PagedDiscussionSearchResults {
  repeated DiscussionSearchResult items = 1;
  int32 offset = 2;
  int32 page_size = 3;
  bool has_more_items = 4;
}

message PostSearchResult {
  string public_id = 1;
  string content_highlight = 2;
  google.protobuf.Timestamp created_at = 3;
  snakk.AuthorRef author = 4;
  string discussion_public_id = 5;
  string discussion_title = 6;
  string discussion_slug = 7;
  snakk.EntityRef space = 8;
  snakk.EntityRef hub = 9;
  string community_slug = 10;
}

message PagedPostSearchResults {
  repeated PostSearchResult items = 1;
  int32 offset = 2;
  int32 page_size = 3;
  bool has_more_items = 4;
}

// --- Sitemap ---

message SitemapRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message SitemapDiscussion {
  string public_id = 1;
  string slug = 2;
  string hub_slug = 3;
  string space_slug = 4;
  string community_slug = 5;
  google.protobuf.Timestamp last_modified = 6;
  bool is_pinned = 7;
}

message SitemapResponse {
  repeated SitemapDiscussion discussions = 1;
  int32 total_count = 2;
}
