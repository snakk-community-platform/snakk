syntax = "proto3";

option csharp_namespace = "Snakk.Protos.Discussion";

package snakk.discussion;

import "Protos/common.proto";
import "google/protobuf/timestamp.proto";

service DiscussionService {
  rpc GetDiscussion (GetDiscussionRequest) returns (DiscussionInfo);
  rpc CreateDiscussion (CreateDiscussionRequest) returns (DiscussionCreatedInfo);
  rpc GetRecentDiscussions (GetRecentDiscussionsRequest) returns (PagedRecentDiscussionList);
  rpc GetTrendingDiscussions (GetTrendingDiscussionsRequest) returns (PagedRecentDiscussionList);
  rpc GetTopDiscussions (GetTopDiscussionsRequest) returns (PagedRecentDiscussionList);
  rpc GetNewDiscussions (GetNewDiscussionsRequest) returns (PagedRecentDiscussionList);
  rpc GetDiscussionsBySpace (GetDiscussionsBySpaceRequest) returns (PagedDiscussionBySpaceList);
  rpc GetDiscussionPreview (GetDiscussionPreviewRequest) returns (DiscussionPreviewInfo);
  rpc GetDiscussionStats (GetDiscussionStatsRequest) returns (DiscussionStats);

  // Poll
  rpc GetPoll (GetPollRequest) returns (PollResponse);
  rpc VotePoll (VotePollRequest) returns (VotePollResponse);
  rpc RemovePollVote (RemovePollVoteRequest) returns (VotePollResponse);

  // Question
  rpc GetQuestionStatus (GetQuestionStatusRequest) returns (QuestionStatusResponse);
  rpc MarkQuestionSolved (MarkQuestionSolvedRequest) returns (MarkQuestionSolvedResponse);

  // Debate
  rpc GetDebateInfo (GetDebateInfoRequest) returns (DebateInfoResponse);
  rpc SetPostDebatePosition (SetPostDebatePositionRequest) returns (SetPostDebatePositionResponse);

  // Journal
  rpc AddJournalEntry (AddJournalEntryRequest) returns (AddJournalEntryResponse);

  // Link
  rpc GetDiscussionLink (GetDiscussionLinkRequest) returns (DiscussionLinkResponse);

  // Batch
  rpc GetDiscussionsByIds (GetDiscussionsByIdsRequest) returns (DiscussionsByIdsResponse);
  rpc GetRecentDiscussionsByIds (GetRecentDiscussionsByIdsRequest) returns (PagedRecentDiscussionList);

  // Images
  rpc GetImagesLayout (GetImagesLayoutRequest) returns (ImagesLayoutResponse);

  // Journal
  rpc GetJournalEntries (GetJournalEntriesRequest) returns (JournalEntriesResponse);

  // IAMA
  rpc GetIamaInfo (GetIamaInfoRequest) returns (IamaInfoResponse);
  rpc MarkIamaOfficialAnswer (MarkIamaOfficialAnswerRequest) returns (MarkIamaOfficialAnswerResponse);
  rpc SetIamaBestQuestions (SetIamaBestQuestionsRequest) returns (SetIamaBestQuestionsResponse);
  rpc TransitionIamaPhase (TransitionIamaPhaseRequest) returns (TransitionIamaPhaseResponse);
}

// --- Requests ---

message GetDiscussionRequest {
  string public_id = 1;
}

message GetDiscussionsByIdsRequest {
  repeated string public_ids = 1;
}

message DiscussionsByIdsResponse {
  repeated DiscussionInfo items = 1;
}

message GetRecentDiscussionsByIdsRequest {
  repeated string public_ids = 1;
}

message CreateDiscussionRequest {
  string space_id = 1;
  string title = 2;
  string content = 3;
  repeated string tags = 4;
  int32 type = 5; // DiscussionTypeEnum value

  // Poll extension fields
  repeated string poll_options = 6;
  bool poll_allow_multiple = 7;
  bool poll_allow_change_vote = 8;
  optional google.protobuf.Timestamp poll_closes_at = 9;

  // Link extension fields
  optional string link_url = 10;

  // Debate extension fields
  repeated string debate_positions = 11;
  bool debate_allow_neutral = 12;

  // Images extension fields
  optional string images_layout = 13; // grid, masonry, justified, carousel, hero
  repeated string images_image_urls = 14;
  bool images_is_spoiler = 24;

  // IAMA extension fields
  bool iama_is_scheduled = 15;
  optional google.protobuf.Timestamp iama_scheduled_start = 16;
  optional google.protobuf.Timestamp iama_scheduled_end = 17;
  optional string iama_verification_note = 18;
  bool poll_secret = 19;
  bool poll_is_segmented = 20;
  optional string poll_segment_label = 21;
  optional string poll_segment_option_a = 22;
  optional string poll_segment_option_b = 23;
}

message GetRecentDiscussionsRequest {
  int32 offset = 1;
  int32 page_size = 2;
  optional string community_id = 3;
  optional string hub_id = 4;
  optional string cursor = 5;
  optional string author_id = 6;
  optional string space_id = 7;
  repeated string space_ids = 8;
}

message GetTrendingDiscussionsRequest {
  int32 offset = 1;
  int32 page_size = 2;
  optional string community_id = 3;
}

message GetTopDiscussionsRequest {
  int32 offset = 1;
  int32 page_size = 2;
  optional string community_id = 3;
  string time_period = 4; // "day", "week", "month", "year", "all_time"
}

message GetNewDiscussionsRequest {
  int32 offset = 1;
  int32 page_size = 2;
  optional string community_id = 3;
  optional string cursor = 4;
}

message GetDiscussionsBySpaceRequest {
  string space_id = 1;
  int32 offset = 2;
  int32 page_size = 3;
  optional int32 type_filter = 4;
  optional string cursor = 5;
}

message GetDiscussionPreviewRequest {
  string discussion_id = 1;
}

message GetDiscussionStatsRequest {
  string public_id = 1;
}

// --- Responses ---

message DiscussionInfo {
  string public_id = 1;
  string title = 2;
  string slug = 3;
  string space_id = 4;
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp last_activity_at = 6;
  bool is_pinned = 7;
  bool is_locked = 8;
  string type = 9;
  int32 post_count = 10;
}

message DiscussionCreatedInfo {
  string public_id = 1;
  string title = 2;
  string slug = 3;
  google.protobuf.Timestamp created_at = 4;
  string type = 5;
}

message RecentDiscussionInfo {
  string public_id = 1;
  string title = 2;
  string slug = 3;
  google.protobuf.Timestamp created_at = 4;
  optional google.protobuf.Timestamp last_activity_at = 5;
  bool is_pinned = 6;
  bool is_locked = 7;
  snakk.EntityRef space = 8;
  snakk.EntityRef hub = 9;
  snakk.EntityRef community = 10;
  snakk.AuthorRef author = 11;
  int32 post_count = 12;
  int32 reaction_count = 13;
  repeated string tags = 14;
  string type = 15;
  optional DiscussionPreview preview = 16;
  optional snakk.AuthorRef last_replier = 17;
  string last_post_excerpt = 18;
}

message DiscussionPreview {
  optional PollPreview poll = 1;
  optional DebatePreview debate = 2;
  optional LinkPreview link = 3;
  optional ImagesPreview images = 4;
  optional IamaPreview iama = 5;
}

message PollPreview {
  repeated PollPreviewOption options = 1;
  int32 total_votes = 2;
  bool is_secret = 3;
  optional google.protobuf.Timestamp closes_at = 4;
  bool is_segmented = 5;
}

message PollPreviewOption {
  string text = 1;
  int32 vote_count = 2;
}

message DebatePreview {
  repeated DebatePreviewPosition positions = 1;
}

message DebatePreviewPosition {
  string label = 1;
  int32 index = 2;
  int32 post_count = 3;
}

message LinkPreview {
  string url = 1;
  optional string title = 2;
  optional string description = 3;
  optional string domain = 4;
  optional string image_url = 5;
  optional string image_path_url = 6;
  optional string oembed_html = 7;
  bool is_internal = 8;
  optional string image_thumbnail_url = 9;
}

message ImagesPreview {
  int32 image_count = 1;
  repeated ImagesPreviewItem items = 2;
  bool is_spoiler = 3;
  string layout = 4;
}

message ImagesPreviewItem {
  string url = 1;
  optional string thumbnail_url = 2;
  optional string blur_data_uri = 3;
  optional string medium_thumbnail_url = 4;
  int32 width = 5;
  int32 height = 6;
  optional int32 thumbnail_width = 7;
  optional int32 thumbnail_height = 8;
  optional int32 medium_thumbnail_width = 9;
  optional int32 medium_thumbnail_height = 10;
}

message IamaPreview {
  int32 phase = 1;
  optional google.protobuf.Timestamp scheduled_start_utc = 2;
  optional google.protobuf.Timestamp scheduled_end_utc = 3;
  int32 official_answer_count = 4;
  int32 best_question_count = 5;
  bool is_verified = 6;
}

message PagedRecentDiscussionList {
  repeated RecentDiscussionInfo items = 1;
  int32 offset = 2;
  int32 page_size = 3;
  bool has_more_items = 4;
  optional string next_cursor = 5;
}

message DiscussionBySpaceInfo {
  string public_id = 1;
  string space_id = 2;
  string title = 3;
  string slug = 4;
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp last_activity_at = 6;
  bool is_pinned = 7;
  bool is_locked = 8;
  int32 post_count = 9;
  int32 reaction_count = 10;
  snakk.AuthorRef author = 11;
  repeated string tags = 12;
  string type = 13;
}

message PagedDiscussionBySpaceList {
  repeated DiscussionBySpaceInfo items = 1;
  int32 offset = 2;
  int32 page_size = 3;
  bool has_more_items = 4;
  optional string next_cursor = 5;
}

message DiscussionPreviewInfo {
  string content = 1;
}

message DiscussionStats {
  string public_id = 1;
  string title = 2;
  int32 reply_count = 3;
  int32 follower_count = 4;
}

// --- Poll ---

message GetPollRequest {
  string discussion_id = 1;
}

message PollResponse {
  repeated PollOptionInfo options = 1;
  bool allow_multiple = 2;
  bool allow_change_vote = 3;
  optional google.protobuf.Timestamp closes_at = 4;
  bool is_closed = 5;
  int32 total_votes = 6;
  repeated int32 user_voted_option_ids = 7;
  bool is_secret = 8;
  bool is_segmented = 9;
  optional string segment_label = 10;
  optional string segment_option_a = 11;
  optional string segment_option_b = 12;
  repeated PollOptionSegmentVotes segment_votes = 13;
  optional int32 user_segment_index = 14;
}

message PollOptionInfo {
  int32 id = 1;
  string text = 2;
  int32 vote_count = 3;
  int32 display_order = 4;
}

message PollOptionSegmentVotes {
  int32 option_id = 1;
  int32 segment_a_count = 2;
  int32 segment_b_count = 3;
}

message VotePollRequest {
  string discussion_id = 1;
  int32 option_id = 2;
  optional int32 segment_index = 3;
}

message VotePollResponse {
  bool success = 1;
  optional string error = 2;
}

message RemovePollVoteRequest {
  string discussion_id = 1;
  int32 option_id = 2;
}

// --- Question ---

message GetQuestionStatusRequest {
  string discussion_id = 1;
}

message QuestionStatusResponse {
  bool is_solved = 1;
  optional string accepted_post_public_id = 2;
  optional google.protobuf.Timestamp solved_at = 3;
}

message MarkQuestionSolvedRequest {
  string discussion_id = 1;
  string post_public_id = 2;
}

message MarkQuestionSolvedResponse {
  bool success = 1;
  optional string error = 2;
}

// --- Debate ---

message GetDebateInfoRequest {
  string discussion_id = 1;
}

message DebateInfoResponse {
  repeated DebatePositionInfo positions = 1;
  bool allow_neutral = 2;
  // Map of post_public_id → position_id for all posts in this debate
  map<string, int32> post_positions = 3;
}

message DebatePositionInfo {
  int32 id = 1;
  string label = 2;
  int32 index = 3;
  int32 post_count = 4;
}

// --- Link ---

message GetDiscussionLinkRequest {
  string discussion_id = 1;
}

message DiscussionLinkResponse {
  string url = 1;
  optional string title = 2;
  optional string description = 3;
  optional string image_url = 4;
  optional string domain = 5;
  optional string oembed_html = 6;
  optional string image_path_url = 7;
  optional string blur_data_uri = 8;
  bool is_internal = 9;
}


// --- Journal ---

message GetJournalEntriesRequest {
  string discussion_id = 1;
}

message JournalEntriesResponse {
  repeated string entry_post_public_ids = 1;
}

// --- Debate: Set post position ---

message SetPostDebatePositionRequest {
  string discussion_id = 1;
  string post_public_id = 2;
  int32 position_id = 3;
}

message SetPostDebatePositionResponse {
  bool success = 1;
  optional string error = 2;
}

// --- Journal: Add entry ---

message AddJournalEntryRequest {
  string discussion_id = 1;
  string post_public_id = 2;
}

message AddJournalEntryResponse {
  bool success = 1;
  optional string error = 2;
}

// --- Images ---

message GetImagesLayoutRequest {
  string discussion_id = 1;
}

message ImagesLayoutResponse {
  string layout = 1;
  repeated ImagesImageProto images = 2;
  bool is_spoiler = 3;
}

message ImagesImageProto {
  string url = 1;
  optional string thumbnail_url = 2;
  optional string blur_data_uri = 3;
  optional string medium_thumbnail_url = 4;
  int32 width = 5;
  int32 height = 6;
  optional int32 thumbnail_width = 7;
  optional int32 thumbnail_height = 8;
  optional int32 medium_thumbnail_width = 9;
  optional int32 medium_thumbnail_height = 10;
}

// --- IAMA ---

message GetIamaInfoRequest {
  string discussion_id = 1;
}

message IamaInfoResponse {
  int32 phase = 1;
  bool is_scheduled = 2;
  optional google.protobuf.Timestamp scheduled_start_utc = 3;
  optional google.protobuf.Timestamp scheduled_end_utc = 4;
  optional string verification_note = 5;
  // Map of question_post_public_id → answer_post_public_id
  map<string, string> official_answers = 6;
  repeated string best_question_post_public_ids = 7;
}

message MarkIamaOfficialAnswerRequest {
  string discussion_id = 1;
  string question_post_public_id = 2;
  string answer_post_public_id = 3;
}

message MarkIamaOfficialAnswerResponse {
  bool success = 1;
  optional string error = 2;
}

message SetIamaBestQuestionsRequest {
  string discussion_id = 1;
  repeated string post_public_ids = 2;
}

message SetIamaBestQuestionsResponse {
  bool success = 1;
  optional string error = 2;
}

message TransitionIamaPhaseRequest {
  string discussion_id = 1;
  int32 new_phase = 2;
}

message TransitionIamaPhaseResponse {
  bool success = 1;
  optional string error = 2;
}
